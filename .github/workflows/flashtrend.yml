name: FlashTrend digest
on:
  schedule:
    - cron: "17 * * * *"   # mỗi giờ, phút 17 (UTC và giờ Việt Nam cùng phút). Phần nặng chạy theo
                           # app_config: youtube_search_every_hours, analysis_every_hours (giờ Việt Nam)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Đọc dữ liệu thật nhưng không ghi gì, không gọi Gemini"
        type: boolean
        default: false
concurrency:
  group: flashtrend
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # lần đầu hỏi thẻ của ~100 kênh Bilibili (có nghỉ giữa các request); sau đó có cache 24 giờ
    env:
      TZ: Asia/Ho_Chi_Minh   # log và giờ trong bot đều theo giờ Việt Nam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Fonts for the charts (Chinese titles need a CJK font; the runner has none by default)
        run: fc-list :lang=zh | grep -q . || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk)
      - run: python -m pip install --upgrade pip
      # CPU-only torch first: the default Linux wheel pulls ~2 GB of CUDA libraries
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Run the digest
        run: python main.py run --output-dir output ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S3_URL: ${{ secrets.S3_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashtrend-output
          path: output/
          if-no-files-found: ignore
          retention-days: 3
