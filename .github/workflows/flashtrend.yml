name: FlashTrend digest
# the request tag in the run's name lets estfstudio's /analysis find the run it started
run-name: FlashTrend ${{ inputs.mode || 'digest' }} ${{ inputs.request }}
on:
  schedule:
    - cron: "17 * * * *"   # mỗi giờ, phút 17 (UTC và giờ Việt Nam cùng phút). Phần nặng chạy theo
                           # app_config: youtube_search_every_hours, analysis_every_hours (giờ Việt Nam)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Đọc dữ liệu thật nhưng không ghi gì, không gọi Gemini"
        type: boolean
        default: false
      mode:
        description: "digest = tổng hợp ngách như lịch chạy · trending = hot toàn Bilibili · search = tìm theo query"
        type: choice
        options: [digest, trending, search]
        default: digest
      query:
        description: "Chế độ search: từ khoá (tiếng Việt cũng được — bot dịch sang tiếng Trung)"
        type: string
        default: ""
      request:
        description: "Mã yêu cầu của người gọi (estfstudio /analysis), lưu vào runs.request_id"
        type: string
        default: ""
      min_minutes:
        description: "trending/search: chỉ giữ video dài từ bấy nhiêu phút (0 = mọi độ dài)"
        type: string
        default: "60"
concurrency:
  # one-off looks run beside the hourly digest instead of queueing behind (or cancelling) each other
  group: flashtrend-${{ inputs.request || 'digest' }}
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # lần đầu hỏi thẻ của ~100 kênh Bilibili (có nghỉ giữa các request); sau đó có cache 24 giờ
    env:
      TZ: Asia/Ho_Chi_Minh   # log và giờ trong bot đều theo giờ Việt Nam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Fonts for the charts (Chinese titles need a CJK font; the runner has none by default)
        run: fc-list :lang=zh | grep -q . || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk)
      - run: python -m pip install --upgrade pip
      # CPU-only torch first: the default Linux wheel pulls ~2 GB of CUDA libraries
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Run the digest
        # the query is user text: it reaches the program through env, quoted, never spliced into the script
        run: python main.py run --output-dir output --mode "$FT_MODE" --query "$FT_QUERY" --request "$FT_REQUEST" --min-minutes "$FT_MIN_MINUTES" ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FT_MODE: ${{ inputs.mode }}
          FT_QUERY: ${{ inputs.query }}
          FT_REQUEST: ${{ inputs.request }}
          FT_MIN_MINUTES: ${{ inputs.min_minutes }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S3_URL: ${{ secrets.S3_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashtrend-output
          path: output/
          if-no-files-found: ignore
          retention-days: 3
