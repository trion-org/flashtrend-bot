[project]
name = "flashtrend-bot"
version = "0.1.0"
description = "FlashTrend: a statistical-semantic filter that writes a daily YouTube trend digest to Supabase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "requests>=2.31",
  "supabase>=2.5",
  "google-api-python-client>=2.130",
]

[project.optional-dependencies]
# L2 embeddings (MiniLM, CPU). On Linux install the CPU-only torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
embed = ["sentence-transformers>=3.0"]
chart = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.setuptools]
packages = []
